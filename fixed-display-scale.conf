# Fixed display scale for this Parallels VM.
#
# When the VM moves between host displays, Parallels swaps the guest's
# resolution mode and mutter's fallback resets the GNOME UI scale to 100%.
# The fixed-display-scale service re-applies the scale below after every
# such change.
#
# scale: target UI scale. Mutter only accepts scales that produce whole-pixel
#   logical sizes for the current mode, so the closest supported value is used
#   automatically (Display Settings shows it rounded). 2.0 is exactly
#   supported on both the 4K external and the MacBook panel.
# enabled: set to "no" to pause enforcement (takes effect within ~10 s;
#   set back to "yes" to resume).
# debounce-ms: how long to wait after the last display change before fixing
#   the scale (Parallels may apply its config in several steps).
# mode-<W>x<H>=<value>: per-resolution override of the target scale, e.g.
#   mode-3840x2160=1.5 to use 150% on the 4K external only.

scale=2
enabled=yes
debounce-ms=600

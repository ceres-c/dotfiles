# User-session environment for GNOME (read by systemd --user at login).
# Desktop environment variables for Wayland and GTK applications.

# Qt applications: prefer Wayland, fall back to X11 when unavailable.
QT_QPA_PLATFORM=wayland;xcb
# Firefox: use the native Wayland backend.
MOZ_ENABLE_WAYLAND=1
# Use the desktop portal for GTK file dialogs.
GTK_USE_PORTAL=1
# Consistent Java font rendering.
_JAVA_OPTIONS=-Dawt.useSystemAAFontSettings=on

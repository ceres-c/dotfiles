# Per-application keyd overrides, applied by keyd-application-mapper on
# window focus changes. Global mappings in /etc/keyd/*.conf still apply
# except where overridden here.
#
# VTE (Terminator's toolkit) intercepts Shift+Home/Shift+End for scroll-to-
# top/bottom and never delivers them to the shell, so the global
# Command+Backspace macro cannot work there. And OpenCode's TUI decodes the
# Ctrl+Backspace byte as a plain backspace, so word deletion needs a key it
# understands: Ctrl+W deletes the previous word in both zsh and OpenCode.
#   Ctrl+U = kill-whole-line (zsh) / delete to line start (OpenCode)
#   Ctrl+K = kill-line       (zsh) / delete to line end   (OpenCode)
#   Ctrl+W = backward-kill-word (zsh) / delete word backward (OpenCode)

[terminator]
meta.backspace = C-u
meta.delete = C-k
alt.backspace = C-w

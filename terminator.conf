[global_config]
  window_state = maximise
  tab_position = top
  extra_styling = True
  title_at_bottom = False
  close_button_on_tab = True
[keybindings]
  # Tabs
  new_tab = <Super>t
  close_term = <Control><Shift>w
  close_window = <Control><Shift>q
  new_window = <Control><Shift>n
  cycle_next = <Control>Tab
  cycle_prev = <Control><Shift>Tab
  next_tab = <Control>Page_Down
  prev_tab = <Control>Page_Up
  move_tab_left = <Control><Alt>Left
  move_tab_right = <Control><Alt>Right
  switch_to_tab_1 = <Super>1
  switch_to_tab_2 = <Super>2
  switch_to_tab_3 = <Super>3
  switch_to_tab_4 = <Super>4
  switch_to_tab_5 = <Super>5
  switch_to_tab_6 = <Super>6
  switch_to_tab_7 = <Super>7
  switch_to_tab_8 = <Super>8
  switch_to_tab_9 = <Super>9
  switch_to_tab_10 = <Super>0
  insert_number = None
  insert_padded = None
  # Pane navigation and splitting
  go_up = <Alt>Up
  go_down = <Alt>Down
  go_left = <Alt>Left
  go_right = <Alt>Right
  split_horiz = <Alt><Super>o
  split_vert = <Alt><Super>e
  split_auto = <Control>asterisk
  toggle_zoom = <Control><Shift>z
  scaled_zoom = <Control><Shift>x
  resize_up = <Control><Shift>Up
  resize_down = <Control><Shift>Down
  resize_left = <Control><Shift>Left
  resize_right = <Control><Shift>Right
  # Clipboard and search
  # Copy/paste stay on Ctrl+Shift+C/V so plain Ctrl+C is always an interrupt.
  # Cmd+C/Cmd+V are translated to these by keyd's [terminator] app override.
  copy = <Control><Shift>c
  paste = <Control><Shift>v
  paste_selection = <Shift>Insert
  search = <Control><Shift>f
  # Font size
  zoom_in = <Control>plus
  zoom_out = <Control>minus
  zoom_normal = <Control>0
  # Miscellaneous
  reset_clear = <Control><Shift>k
  full_screen = F11
  preferences = <Control><Shift>comma
  preferences_keybindings = <Control><Alt>comma
  group_tab = <Shift><Alt><Super>t
  help = F1
[profiles]
  [[default]]
    # Breeze Dark palette used by this GNOME VM setup.
    background_color = "#31363b"
    foreground_color = "#fcfcfc"
    palette = "#31363b:#ed1515:#11d116:#f67400:#1d99f3:#8e44ad:#16a085:#fcfcfc:#31363b:#ed1515:#11d116:#f67400:#1d99f3:#8e44ad:#16a085:#fcfcfc"
    use_theme_colors = False
    bold_is_bright = True
    # Sauce Code Pro Nerd Font, 15pt.
    font = SauceCodePro Nerd Font 15
    use_system_font = False
    # Block cursor and no per-pane title bar.
    cursor_shape = block
    cursor_blink = False
    cursor_color_default = True
    show_titlebar = False
    title_use_system_font = False
    title_font = SauceCodePro Nerd Font 10
    title_hide_sizetext = True
    # Unlimited scrollback.
    scrollback_infinite = True
    scroll_on_output = False
    scroll_on_keystroke = True
    # Silence all terminal bells.
    audible_bell = False
    visible_bell = False
    urgent_bell = False
    icon_bell = False
    force_no_bell = True
    allow_bold = True
    copy_on_selection = False
    login_shell = False
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
[plugins]

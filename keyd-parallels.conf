[ids]
*

# Left Option is Alt; right Option is AltGr on the Debian keyboard layout.
[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[altgr]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# Parallels sends macOS Command as Meta/Super.
[meta]
left = home
right = end
backspace = macro(home home S-end backspace)
delete = macro(S-end delete)
# Cmd+V acts as Ctrl+V (paste in GUI apps; Terminator and VS Code's terminal
# bind Ctrl+V to paste). Cmd+C is NOT translated: it passes through as
# Super+C and GNOME's custom keybinding runs the copy-primary helper, so
# Ctrl+C remains a pure interrupt in every terminal.
v = C-v

# In Terminator, Command+Option arrows should reach its pane-navigation keys.
[meta+alt]
up = A-up
down = A-down
left = A-left
right = A-right

[meta+altgr]
up = A-up
down = A-down
left = A-left
right = A-right

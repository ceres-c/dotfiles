[ids]
*

# Left Option is Alt; right Option is AltGr on the Debian keyboard layout.
[alt]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[altgr]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

# Parallels sends macOS Command as Meta/Super.
[meta]
left = home
right = end
backspace = macro(home home S-end backspace)
delete = macro(S-end delete)
# Clipboard: Cmd+C/V act as Ctrl+C/V. GUI apps copy/paste; in terminals,
# Terminator's smart_copy only copies when text is selected and otherwise
# lets the interrupt through, and VS Code's terminal bindings in
# vscode-keybindings.json do the same via terminalTextSelected.
c = C-c
v = C-v

# In Terminator, Command+Option arrows should reach its pane-navigation keys.
[meta+alt]
up = A-up
down = A-down
left = A-left
right = A-right

[meta+altgr]
up = A-up
down = A-down
left = A-left
right = A-right
